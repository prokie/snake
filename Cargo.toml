[workspace]
members = ["protocol", "party_game", "minigames/pong", "minigames/snake"]
resolver = "2"


[workspace.dependencies]
bevy = "0.20.1"
rand = "0.10.3"
lightyear = { version = "0.31.0", features = [
    "client",
    "server",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
    "udp",
    "netcode",
] }
serde = { version = "1.0.229", features = ["derive"] }
protocol = { path = "protocol" }
pong = { path = "minigames/pong" }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
